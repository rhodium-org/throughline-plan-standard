title: An activity follows activities, milestones, phases and shifts
text: An activity follows activities, milestones, phases and shifts.
rationale: 'An activity, milestone, phase or shift follows another activity, milestone,
  phase or shift: it may begin only once the one it follows has finished. Following
  a phase means following its last part to finish; a phase that follows an item has
  none of its parts begin before that item finishes. A plan''s order is made of this
  link alone. Following is grounding, so a circular order fails the check, and a
  change to an item marks what follows it suspect.'
