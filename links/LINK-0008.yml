uid: LINK-0008
type: link
status: proposed
title: A milestone starts an activity
text: A milestone starts an activity.
rationale: 'RULE-0024: A milestone that starts an activity is the moment the activity
  begins. An item that follows it begins no earlier than the activity does, and where
  it follows another item the activity begins no earlier than that item finishes,
  so start-to-start and start-to-finish orders need no link of their own.'
