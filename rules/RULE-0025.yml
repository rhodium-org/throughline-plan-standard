uid: RULE-0025
type: rule
status: proposed
title: The finishes link names an activity's finish
text: A milestone that finishes an activity is the moment the activity ends. Where
  it follows another item the activity ends no earlier than that item finishes, so
  finish-to-finish orders need no link of their own.
rationale: Declared in throughline.toml in [links] types with link_rules.finishes
  = { from = [milestone], to = [activity] }.
normative: true
