uid: RULE-0027
type: rule
status: ratified
title: A shift sits between two items
text: A shift follows exactly the item it delays and is followed by the item it delays;
  one with nothing on either side is an error.
rationale: 'Declared in throughline.toml as two coverage rules on type == ''shift'':
  needs = ''outgoing:follows'' and needs = ''incoming:follows'', severity error.'
normative: true
