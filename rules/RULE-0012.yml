title: A activity's who
text: 'A activity may record who: who does the work, as text that nothing is worked
  out from. Its value is text. Not part of what a signature covers.'
rationale: 'Declared in throughline.toml as [types.activity] attrs.who = {"type":
  "string", "normative": false}.'
normative: true
