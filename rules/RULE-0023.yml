uid: RULE-0023
type: rule
status: ratified
title: The part_of link breaks a plan down
text: An activity, milestone or phase is part of the plan or of a phase. The span
  of a phase is worked out from its parts, never recorded.
rationale: Declared in throughline.toml in [links] types and ground_link_types, with
  link_rules.part_of = { from = [activity, milestone, phase], to = [plan, phase]
  }.
normative: true
