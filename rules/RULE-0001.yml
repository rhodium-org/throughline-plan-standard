uid: RULE-0001
type: rule
status: ratified
title: A plan item is what a plan graph is about
text: 'A plan graph holds one plan item: the plan''s name and the day its work begins.
  Every activity, milestone and phase is part of it, directly or through a phase.'
rationale: Declared in throughline.toml as [types.plan].
