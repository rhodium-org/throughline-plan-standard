uid: RULE-0030
type: rule
status: proposed
title: A plan pins an edition of the standard
text: A plan names the standard as its schema source at a tagged edition, never at
  a branch, so that a new edition reaches it only when it moves its pin.
rationale: A branch would carry every change, breaking ones included, to every follower
  at once.
normative: true
