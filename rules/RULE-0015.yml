uid: RULE-0015
type: rule
status: ratified
title: An activity's remaining
text: 'An activity may record remaining: how many working days of the work are left,
  as last judged. Its value is a number. Not part of what a signature covers.'
rationale: 'Declared in throughline.toml as [types.activity] attrs.remaining = {"type":
  "float", "normative": false}.'
