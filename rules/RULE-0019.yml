uid: RULE-0019
type: rule
status: proposed
title: A deadline's set by
text: 'A deadline records set_by: who or what sets the deadline: a contract, a regulator,
  an event. Its value is text. Required. Part of what a signature on the item covers.'
rationale: 'Declared in throughline.toml as [types.deadline] attrs.set_by = {"type":
  "string", "required": true, "normative": true}.'
normative: true
