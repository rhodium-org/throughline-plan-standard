uid: RULE-0006
type: rule
status: ratified
title: Time in a plan is counted in working days
text: Every duration, estimate, shift and remaining figure in a plan is a number
  of working days, which may be a fraction. A working day is Monday to Friday; this
  edition has no holidays.
rationale: One unit everywhere means no figure needs its unit stated beside it; calendars
  are left for a later edition.
normative: true
