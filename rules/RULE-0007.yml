uid: RULE-0007
type: rule
status: proposed
title: A ratified plan is its baseline, and progress never moves it
text: Ratifying a plan's items records the plan as committed. Changing a duration,
  an estimate, a shift or a link afterwards shows as drift from that baseline. What
  has actually happened (started, finished, reached, remaining) is not part of what
  a signature covers, so recording it never unsettles one.
rationale: A signature covers an item's normative attributes, and an absent normative
  attribute still enters the fingerprint, so progress attributes are declared normative
  = false.
normative: true
