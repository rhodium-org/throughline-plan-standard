uid: RULE-0005
type: rule
status: ratified
title: A deadline is a kind of item a plan holds
text: A deadline is a date a plan must meet, set from outside the plan, and who or
  what sets it. A milestone meets it. A deadline may stand on its own, and one that
  nothing meets is a finding.
rationale: Declared in throughline.toml as [types.deadline].
normative: true
