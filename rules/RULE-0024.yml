uid: RULE-0024
type: rule
status: ratified
title: The starts link names an activity's start
text: A milestone that starts an activity is the moment the activity begins. An item
  that follows it begins no earlier than the activity does, and where it follows
  another item the activity begins no earlier than that item finishes, so start-to-start
  and start-to-finish orders need no link of their own.
rationale: Declared in throughline.toml in [links] types with link_rules.starts =
  { from = [milestone], to = [activity] }.
normative: true
