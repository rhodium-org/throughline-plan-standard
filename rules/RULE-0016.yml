uid: RULE-0016
type: rule
status: ratified
title: A milestone's reached
text: 'A milestone may record reached: the day the milestone was actually reached.
  Its value is a calendar date, YYYY-MM-DD. Not part of what a signature covers.'
rationale: 'Declared in throughline.toml as [types.milestone] attrs.reached = {"type":
  "date", "normative": false}.'
normative: true
