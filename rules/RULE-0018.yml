uid: RULE-0018
type: rule
status: ratified
title: A deadline's date
text: 'A deadline records date: the day by which the milestones that meet it must
  be reached. Its value is a calendar date, YYYY-MM-DD. Required. Part of what a
  signature on the item covers.'
rationale: 'Declared in throughline.toml as [types.deadline] attrs.date = {"type":
  "date", "required": true, "normative": true}.'
normative: true
