uid: RULE-0008
type: rule
status: ratified
title: A plan's start
text: 'A plan records start: the first working day of the plan, from which every
  date in it is worked out. Its value is a calendar date, YYYY-MM-DD. Required. Part
  of what a signature on the item covers.'
rationale: 'Declared in throughline.toml as [types.plan] attrs.start = {"type": "date",
  "required": true, "normative": true}.'
normative: true
