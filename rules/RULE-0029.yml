uid: RULE-0029
type: rule
status: proposed
title: The lifecycle of an item in a plan
text: Every item in a plan moves through the statuses proposed, draft, deferred,
  approved, ratified, implemented, verified, suspect, rejected and deleted, along
  the transitions the standard declares, with draft born, proposed put forward, ratified
  signed, rejected invalidated, suspect withdrawn and deleted tombstoned.
rationale: Declared in throughline.toml under [status], [status.roles] and [transitions].
normative: true
