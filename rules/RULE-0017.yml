uid: RULE-0017
type: rule
status: proposed
title: A shift's by
text: 'A shift records by: how many working days later what follows it may begin;
  negative brings it earlier. Its value is a number. Required. Part of what a signature
  on the item covers.'
rationale: 'Declared in throughline.toml as [types.shift] attrs.by = {"type": "float",
  "required": true, "normative": true}.'
normative: true
