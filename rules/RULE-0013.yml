uid: RULE-0013
type: rule
status: ratified
title: An activity's started
text: 'An activity may record started: the day the work actually started. Its value
  is a calendar date, YYYY-MM-DD. Not part of what a signature covers.'
rationale: 'Declared in throughline.toml as [types.activity] attrs.started = {"type":
  "date", "normative": false}.'
normative: true
