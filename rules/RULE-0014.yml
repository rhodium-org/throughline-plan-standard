uid: RULE-0014
type: rule
status: proposed
title: An activity's finished
text: 'An activity may record finished: the day the work actually finished. Its value
  is a calendar date, YYYY-MM-DD. Not part of what a signature covers.'
rationale: 'Declared in throughline.toml as [types.activity] attrs.finished = {"type":
  "date", "normative": false}.'
normative: true
