title: A full conforming plan
text: conformance/full-plan holds a plan broken down into activities with estimates,
  a lag and a lead as shift items, a start-to-start order through start milestones,
  a finish-to-finish order through finish milestones, a deadline met by a milestone,
  and progress recorded on a ratified activity. It passes tl check against the standard.
