title: A plan's shifts live in SH
text: A plan graph holds its shift items in SH, folder shifts/.
rationale: 'RULE-0004: A shift moves what follows it later or earlier by a number
  of working days. Placed between two items in a chain it is a lag when positive
  and a lead when negative.'
