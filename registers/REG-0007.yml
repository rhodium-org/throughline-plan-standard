title: A plan's activities live in ACT
text: A plan graph holds its activity items in ACT, folder activities/.
rationale: 'An activity is work that takes time: how many working days it is expected
  to take, what the estimate''s range is, who does it and how far it has got. It
  is part of the plan or of a phase, and nothing is part of it.'
