uid: CON-0005
type: constraint
status: proposed
title: Nothing that can be worked out is stored
text: 'The standard declares no attribute for a figure that can be worked out from
  durations, shifts and links: early and late dates, slack, the critical path, or
  the span of an activity that has parts.'
rationale: A stored figure drifts from the inputs it came from, and then two answers
  disagree.
normative: true
