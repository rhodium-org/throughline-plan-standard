uid: CON-0002
type: constraint
status: proposed
title: A change that would fail a conforming plan is a new major edition
text: The standard is released as tagged editions. An edition that removes or narrows
  anything a conforming plan may rely on is a new major, and its notes say what a
  plan must change.
rationale: Once plans inherit the standard, every one that moves its pin takes a
  change at once.
normative: true
