uid: CON-0004
type: constraint
status: ratified
title: The standard holds what a plan is, never how it is drawn
text: Nothing in the standard names or depends on a colour, scale, row, bar, lane
  or layout.
rationale: One plan may be drawn as a Gantt chart, a board or a list; drawing belongs
  to the viewer.
normative: true
