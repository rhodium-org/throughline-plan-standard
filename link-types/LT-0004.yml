uid: LT-0004
type: link_type
status: ratified
title: The link type finishes
text: A plan graph's finishes link.
rationale: A milestone that finishes an activity is the moment the activity ends.
  Where it follows another item the activity ends no earlier than that item finishes,
  so finish-to-finish orders need no link of their own.
